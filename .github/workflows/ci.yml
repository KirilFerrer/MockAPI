name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run API regression tests
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          for file in app/ui/static/js/*.js; do
            node --check "$file"
          done
