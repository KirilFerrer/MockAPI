<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear ticket | Northstar Service Desk</title>
  <link rel="stylesheet" href="/static/styles.css"><script defer src="/static/core.js"></script><script defer src="/static/form.js"></script>
</head>
<body data-resource="tickets" data-mode="create">
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">NS</span><span><strong>Northstar</strong><small>Service Desk</small></span></a>
    <nav class="nav"><a href="/">Vista general</a><a class="active" href="/tickets/">Tickets</a><a href="/assets/">Activos</a><a href="/vendors/">Proveedores</a></nav>
    <form class="api-settings" id="api-settings"><label for="api-url">URL de API</label><div class="api-input-row"><input id="api-url" name="api-url" type="url"><button type="submit">OK</button></div><p>Conexión REST operativa.</p></form>
  </aside>
  <div class="shell"><header class="topbar"><div><p class="eyebrow">Tickets</p><h1>Crear ticket</h1></div><a class="button secondary" href="/tickets/">Volver</a></header><main>
    <div class="alert danger" id="page-alert" hidden></div>
    <section class="panel form-panel"><div class="panel-head"><div><h2>Datos de la solicitud</h2><p>Registra una nueva incidencia para seguimiento.</p></div></div>
      <form class="resource-form" id="resource-form">
        <label class="field"><span>Título *</span><input name="title" required placeholder="VPN access fails for remote employees"></label>
        <label class="field"><span>Prioridad *</span><select name="priority" required><option value="">Selecciona</option><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option><option value="critical">Critical</option></select></label>
        <label class="field"><span>Estado *</span><select name="status" required><option value="open">Open</option><option value="in_progress">In progress</option><option value="waiting">Waiting</option><option value="closed">Closed</option></select></label>
        <label class="field"><span>Cola</span><select name="queue"><option value="">Selecciona</option><option>Service Desk</option><option>IT Operations</option><option>Finance Ops</option><option>Security Review</option></select></label>
        <label class="field"><span>Responsable</span><input name="assignee" placeholder="Alex Morgan"></label><label class="field"><span>Solicitante</span><input name="requester" placeholder="Taylor Brooks"></label>
        <label class="field textarea"><span>Descripción</span><textarea name="description" rows="5" placeholder="Describe el contexto operativo del ticket."></textarea></label>
        <div class="form-actions"><button class="button primary" type="submit">Crear ticket</button></div>
      </form>
    </section>
  </main></div>
</body>
</html>
