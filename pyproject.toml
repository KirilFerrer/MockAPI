# Declares the project's Python metadata and main dependencies.
[project]
name = "mockapi"
version = "0.1.0"
description = "Local HTTP API simulator with schema-driven fake data and a web editor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.18.0",
    "fastapi>=0.136.1",
    "jinja2>=3.1.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.11"]

[tool.ruff.lint]
# Error-focused checks; FastAPI Depends() defaults are valid by design.
select = ["E4", "E7", "E9", "F"]
