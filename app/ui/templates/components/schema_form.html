<div class="schema-builder js-schema-form">
  <div class="field">
    <label>Schema name</label>
    <input type="text" class="js-schema-name" placeholder="Basic user"/>
  </div>

  <div class="schema-advanced-state js-schema-advanced-state" hidden>
    <strong>Advanced schema</strong>
    <span>Edit this schema in the JSON editor.</span>
  </div>

  <div class="js-schema-visual-editor">
    <div class="schema-root">
      <div class="field">
        <label>Response structure</label>
        <select class="js-schema-shape">
          <option value="object">Single object</option>
          <option value="array">Collection of objects</option>
        </select>
      </div>
      <div class="field js-schema-count" hidden>
        <label>Initial items</label>
        <input class="js-schema-min-items" type="number" min="1" value="4"/>
      </div>
    </div>

    <div class="schema-head">
      <span>name</span><span>type</span><span>generator</span><span>required</span><span></span>
    </div>

    <div class="schema-rows js-schema-rows"></div>

    <button class="btn-add js-add-schema-field" type="button">+ add field</button>
  </div>

  <button class="btn-secondary js-save-schema" type="button">Save schema only</button>
</div>
